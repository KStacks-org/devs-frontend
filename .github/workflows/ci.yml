name: Build and publish

on:
  push:
    branches: [dev, prod]
    tags: ['v*']
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_API_URL: https://api-build.invalid/devs/api/v1
          VITE_USE_MOCKS: "false"

  container:
    needs: verify
    uses: KStacks-org/.github/.github/workflows/container.yml@1a102e833bd6e3f966b496a95d3aabf4cbaa1f69
    with:
      frontend: true
    secrets: inherit
